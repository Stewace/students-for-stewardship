<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEC Map — Piedmont SC</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #2d5016;
      color: white;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 1rem; font-weight: 600; }
    header p  { font-size: 0.8rem; opacity: 0.75; }

    #map { flex: 1; }

    /* Layer control panel */
    .info-panel {
      position: absolute;
      bottom: 30px;
      left: 10px;
      z-index: 1000;
      background: white;
      border-radius: 6px;
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      max-width: 220px;
      font-size: 0.8rem;
    }

    .info-panel h3 { font-size: 0.85rem; margin-bottom: 8px; color: #333; }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* Click info popup */
    #click-info {
      position: absolute;
      top: 60px;
      right: 10px;
      z-index: 1000;
      background: white;
      border-radius: 6px;
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      max-width: 240px;
      font-size: 0.8rem;
      display: none;
    }

    #click-info h3 { font-size: 0.85rem; margin-bottom: 8px; }
    #click-info table { width: 100%; border-collapse: collapse; }
    #click-info td { padding: 2px 4px; }
    #click-info td:first-child { color: #666; }
    #click-info td:last-child { font-weight: 500; text-align: right; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Landscape Ecosystem Classification — Piedmont SC</h1>
    <p>Hunnicutt Creek Watershed · Jones/Hutto LEC Framework</p>
  </div>
</header>

<div id="map"></div>

<!-- LEC Legend -->
<div class="info-panel">
  <h3>LEC Classes</h3>
  <div class="legend-item">
    <div class="legend-swatch" style="background:#c62828"></div>
    <span>Xeric Ridge / Upper Slope</span>
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background:#f57f17"></div>
    <span>Dry-Mesic Slope</span>
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background:#558b2f"></div>
    <span>Mesic Slope</span>
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background:#1565c0"></div>
    <span>Cove / Hollow</span>
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background:#00695c"></div>
    <span>Bottomland / Riparian</span>
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background:#9e9e9e"></div>
    <span>Upland Flat</span>
  </div>
</div>

<!-- Click info panel -->
<div id="click-info">
  <h3>Point Information</h3>
  <table id="click-table"></table>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // ---------------------------------------------------------------------------
  // Map initialization — centered on Piedmont SC (Hunnicutt Creek area)
  // ---------------------------------------------------------------------------
  const map = L.map('map').setView([34.85, -82.4], 12);

  // ---------------------------------------------------------------------------
  // Base layers
  // ---------------------------------------------------------------------------
  const osm = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { attribution: '© OpenStreetMap contributors', maxZoom: 19 }
  );

  const satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { attribution: 'Tiles © Esri', maxZoom: 19 }
  );

  const topo = L.tileLayer(
    'https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}',
    { attribution: 'Tiles courtesy of the US Geological Survey', maxZoom: 16 }
  );

  // Default base layer
  topo.addTo(map);

  // ---------------------------------------------------------------------------
  // Overlay layers (replace src URLs with your actual GeoTIFF tile endpoints)
  // ---------------------------------------------------------------------------

  // Hillshade (generated by terrain_analysis.py)
  // To serve locally: use gdal2tiles.py or TileServer GL
  const hillshade = L.tileLayer(
    'tiles/hillshade/{z}/{x}/{y}.png',
    { opacity: 0.5, attribution: 'Hillshade: USGS 3DEP', maxZoom: 16 }
  );

  // Slope raster tiles
  const slopeLayer = L.tileLayer(
    'tiles/slope/{z}/{x}/{y}.png',
    { opacity: 0.65, attribution: 'Slope: WhiteboxTools', maxZoom: 16 }
  );

  // LEC classification raster (generated after running LDA)
  const lecLayer = L.tileLayer(
    'tiles/lec_classified/{z}/{x}/{y}.png',
    { opacity: 0.7, attribution: 'LEC: Jones/Hutto framework', maxZoom: 16 }
  );

  // ---------------------------------------------------------------------------
  // Example: GeoJSON watershed boundary
  // Load from file or fetch from API
  // ---------------------------------------------------------------------------
  // fetch('data/watershed_boundary.geojson')
  //   .then(r => r.json())
  //   .then(data => {
  //     L.geoJSON(data, {
  //       style: { color: '#1565c0', weight: 2, fillOpacity: 0.05 }
  //     }).addTo(map);
  //   });

  // ---------------------------------------------------------------------------
  // Layer control
  // ---------------------------------------------------------------------------
  const baseLayers = {
    'USGS Topo': topo,
    'OpenStreetMap': osm,
    'Satellite': satellite,
  };

  const overlays = {
    'Hillshade': hillshade,
    'Slope': slopeLayer,
    'LEC Classification': lecLayer,
  };

  L.control.layers(baseLayers, overlays, { position: 'topright' }).addTo(map);
  L.control.scale({ imperial: true, metric: true }).addTo(map);

  // ---------------------------------------------------------------------------
  // Click handler — show coordinates and placeholder values
  // ---------------------------------------------------------------------------
  const clickInfo = document.getElementById('click-info');
  const clickTable = document.getElementById('click-table');

  map.on('click', function (e) {
    const lat = e.latlng.lat.toFixed(5);
    const lng = e.latlng.lng.toFixed(5);

    // TODO: Replace placeholder values with actual raster queries
    // (Use a server-side endpoint or COG pixel reader)
    clickTable.innerHTML = `
      <tr><td>Latitude</td><td>${lat}°</td></tr>
      <tr><td>Longitude</td><td>${lng}°</td></tr>
      <tr><td>Elevation</td><td>— m</td></tr>
      <tr><td>Slope</td><td>— °</td></tr>
      <tr><td>TSI</td><td>—</td></tr>
      <tr><td>LEC Class</td><td>—</td></tr>
    `;
    clickInfo.style.display = 'block';
  });
</script>

</body>
</html>
