<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f1c0f">
  <title>Pickens Land Map</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <div id="cesiumContainer"></div>

  <form id="search-form" autocomplete="off">
    <input id="search-q" type="search" placeholder="Search owner, TMS #, or address" enterkeyhint="search">
    <button type="submit" aria-label="Search">Go</button>
  </form>

  <div id="lec-chip"><span id="lec-status">Loading terrain…</span><div class="bar"><div id="lec-bar"></div></div></div>

  <div id="fabs">
    <button class="fab" id="btn-layers" aria-label="Layers">Layers</button>
    <button class="fab" id="btn-locate" aria-label="My location">GPS</button>
    <button class="fab" id="btn-share" aria-label="Copy link">Share</button>
  </div>

  <div id="drawbar" hidden>
    <span id="draw-readout"></span>
    <button id="draw-undo">Undo</button>
    <button id="draw-done" class="primary">Done</button>
    <button id="draw-cancel" aria-label="Cancel">✕</button>
  </div>

  <nav id="toolbar">
    <button data-mode="identify" class="active"><i>⌖</i><span>Identify</span></button>
    <button data-mode="line"><i>⟷</i><span>Distance</span></button>
    <button data-mode="area"><i>▱</i><span>Area</span></button>
    <button data-mode="profile"><i>∿</i><span>Profile</span></button>
    <button data-mode="pin"><i>◆</i><span>Pin</span></button>
    <button id="tb-track"><i>●</i><span>Track</span></button>
    <button id="tb-saved"><i>☰</i><span>Saved</span></button>
  </nav>

  <section id="sheet" aria-live="polite">
    <header><span id="sheet-title"></span><button id="sheet-close" aria-label="Close">✕</button></header>
    <div id="sheet-body"></div>
  </section>

  <div id="toast" role="status"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
