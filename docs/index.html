<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LEC Classification — Piedmont SC</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #cesiumContainer { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #header {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(20, 35, 20, 0.88); color: #fff;
      padding: 7px 16px; border-radius: 8px;
      font-family: sans-serif; font-size: 13px; text-align: center;
      z-index: 100; pointer-events: none; white-space: nowrap;
    }
    #header strong { color: #8bc34a; }
    #header small { display: block; color: #aaa; font-size: 11px; margin-top: 2px; }

    #layer-controls {
      position: absolute; top: 10px; right: 10px;
      background: rgba(20, 35, 20, 0.88); color: #fff;
      padding: 10px 14px; border-radius: 8px;
      font-family: sans-serif; font-size: 13px; z-index: 100;
      min-width: 160px;
    }
    #layer-controls strong { color: #8bc34a; display: block; margin-bottom: 6px; }
    #layer-controls label { display: flex; align-items: center; gap: 7px; margin: 5px 0; cursor: pointer; }
    #layer-controls input[type=range] { width: 80px; accent-color: #8bc34a; }

    #legend {
      position: absolute; bottom: 20px; right: 10px;
      background: rgba(20, 35, 20, 0.88); color: #fff;
      padding: 10px 14px; border-radius: 8px;
      font-family: sans-serif; font-size: 12px; z-index: 100;
    }
    #legend h4 { color: #8bc34a; margin-bottom: 6px; font-size: 13px; }
    .legend-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .legend-swatch { width: 14px; height: 14px; border-radius: 2px; flex-shrink: 0; }

    #info-panel {
      position: absolute; bottom: 20px; left: 10px;
      background: rgba(20, 35, 20, 0.92); color: #fff;
      padding: 12px 16px; border-radius: 10px;
      font-family: monospace; font-size: 13px;
      min-width: 220px; display: none; z-index: 100;
    }
    #info-panel h4 { color: #8bc34a; margin-bottom: 8px; font-size: 13px; letter-spacing: 1px; }
    #info-panel table { width: 100%; border-collapse: collapse; }
    #info-panel td { padding: 3px 4px; }
    #info-panel td:first-child { color: #aaa; padding-right: 10px; }
    #info-panel td:last-child { color: #fff; font-weight: bold; }
    #close-info {
      position: absolute; top: 8px; right: 10px;
      cursor: pointer; color: #aaa; font-size: 16px; font-family: sans-serif;
    }

    .cesium-widget-credits { display: none !important; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <div id="header">
    <strong>LEC + Terrain — Hunnicutt Creek Watershed, Piedmont SC</strong>
    <small>Tap to identify · Pinch to tilt · Two fingers to rotate</small>
  </div>

  <div id="layer-controls">
    <strong>Layers</strong>
    <label><input type="checkbox" id="lec-toggle" checked> LEC Classification</label>
    <label>
      Opacity
      <input type="range" id="lec-opacity" min="0" max="100" value="75">
    </label>
    <label><input type="checkbox" id="hillshade-toggle" checked> Hillshade</label>
    <label><input type="checkbox" id="terrain-toggle" checked> 3D Terrain</label>
    <label><input type="checkbox" id="view-toggle"> 2D Mode</label>
  </div>

  <div id="legend">
    <h4>LEC Classes</h4>
    <div class="legend-row"><div class="legend-swatch" style="background:#c62828"></div>Xeric Ridge</div>
    <div class="legend-row"><div class="legend-swatch" style="background:#f57f17"></div>Dry-Mesic Slope</div>
    <div class="legend-row"><div class="legend-swatch" style="background:#558b2f"></div>Mesic Slope</div>
    <div class="legend-row"><div class="legend-swatch" style="background:#1565c0"></div>Cove / Hollow</div>
    <div class="legend-row"><div class="legend-swatch" style="background:#00695c"></div>Bottomland</div>
    <div class="legend-row"><div class="legend-swatch" style="background:#9e9e9e"></div>Upland Flat</div>
  </div>

  <div id="info-panel">
    <span id="close-info" onclick="document.getElementById('info-panel').style.display='none'">&#x2715;</span>
    <h4>POINT INFO</h4>
    <table>
      <tr><td>Latitude</td><td id="pt-lat">—</td></tr>
      <tr><td>Longitude</td><td id="pt-lon">—</td></tr>
      <tr><td>Elevation</td><td id="pt-elev">—</td></tr>
      <tr><td>LEC Class</td><td id="pt-lec">—</td></tr>
    </table>
  </div>

  <script>
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI2YjVjM2Y1Ni1jMGI4LTQ3MjktYWY4My1iMTI3ZDQ2ZDIzN2YiLCJpZCI6NDAzMTA5LCJpYXQiOjE3NzM0MTAzNTd9.VidG6jNAvEQCUxzW6iPCk8Awlv8-Zwx-0c1XcYBBa-o';

    // Use new Terrain API (1.111+) with fallback
    const terrainOpts = { requestVertexNormals: true };
    const worldTerrain = Cesium.Terrain
      ? Cesium.Terrain.fromWorldTerrain(terrainOpts)
      : Cesium.createWorldTerrain(terrainOpts);

    const viewerOpts = {
      baseLayerPicker: false, navigationHelpButton: false,
      homeButton: false, sceneModePicker: false, geocoder: false,
      animation: false, timeline: false, fullscreenButton: false,
      infoBox: false, selectionIndicator: false,
    };
    if (Cesium.Terrain) {
      viewerOpts.terrain = worldTerrain;
    } else {
      viewerOpts.terrainProvider = worldTerrain;
    }

    const viewer = new Cesium.Viewer('cesiumContainer', viewerOpts);

    viewer.scene.globe.depthTestAgainstTerrain = true;
    viewer.scene.globe.enableLighting = false;

    // Keep Ion default imagery (Bing Maps — reliable, no CORS)
    // Add OSM on top only if Ion imagery fails
    const baseLayer = viewer.imageryLayers.get(0);

    const tileBounds = Cesium.Rectangle.fromDegrees(-83.0663, 34.6723, -82.8953, 34.8135);

    const hillshadeLayer = viewer.imageryLayers.addImageryProvider(
      new Cesium.UrlTemplateImageryProvider({
        url: 'tiles/hillshade/{z}/{x}/{y}.png',
        minimumLevel: 12, maximumLevel: 15,
        rectangle: tileBounds,
      })
    );
    hillshadeLayer.alpha = 0.5;

    const lecLayer = viewer.imageryLayers.addImageryProvider(
      new Cesium.UrlTemplateImageryProvider({
        url: 'tiles/lec_classified/{z}/{x}/{y}.png',
        minimumLevel: 12, maximumLevel: 15,
        rectangle: tileBounds,
      })
    );
    lecLayer.alpha = 0.75;

    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(-82.981, 34.69, 12000),
      orientation: {
        heading: Cesium.Math.toRadians(340),
        pitch: Cesium.Math.toRadians(-38),
        roll: 0,
      },
      duration: 2,
    });

    const LEC_NAMES = {
      1: 'Xeric Ridge', 2: 'Dry-Mesic Slope', 3: 'Mesic Slope',
      4: 'Cove / Hollow', 5: 'Bottomland', 6: 'Upland Flat',
    };

    let lecGrid = null;
    fetch('lec_data.json')
      .then(r => r.json())
      .then(d => { lecGrid = d.points; })
      .catch(() => {});

    function nearestLEC(lon, lat) {
      if (!lecGrid) return null;
      let best = null, bestDist = Infinity;
      for (const p of lecGrid) {
        const dx = p[0] - lon, dy = p[1] - lat;
        const d = dx * dx + dy * dy;
        if (d < bestDist) { bestDist = d; best = p; }
      }
      return bestDist < 0.003 * 0.003 ? best : null;
    }

    function handlePick(position) {
      let cartesian = viewer.scene.pickPosition(position);
      if (!Cesium.defined(cartesian)) {
        cartesian = viewer.camera.pickEllipsoid(position, viewer.scene.globe.ellipsoid);
      }
      if (!Cesium.defined(cartesian)) return;

      const carto = Cesium.Cartographic.fromCartesian(cartesian);
      const lat = Cesium.Math.toDegrees(carto.latitude);
      const lon = Cesium.Math.toDegrees(carto.longitude);
      const elev = carto.height;

      document.getElementById('pt-lat').textContent = lat.toFixed(5) + '\u00b0';
      document.getElementById('pt-lon').textContent = lon.toFixed(5) + '\u00b0';
      document.getElementById('pt-elev').textContent = isFinite(elev) ? elev.toFixed(0) + ' m' : '\u2014';

      const pt = nearestLEC(lon, lat);
      document.getElementById('pt-lec').textContent = pt ? (LEC_NAMES[pt[2]] || '\u2014') : '\u2014';
      document.getElementById('info-panel').style.display = 'block';
    }

    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    handler.setInputAction(e => handlePick(e.position), Cesium.ScreenSpaceEventType.LEFT_CLICK);

    document.getElementById('lec-toggle').addEventListener('change', e => {
      lecLayer.show = e.target.checked;
    });
    document.getElementById('lec-opacity').addEventListener('input', e => {
      lecLayer.alpha = e.target.value / 100;
    });
    document.getElementById('hillshade-toggle').addEventListener('change', e => {
      hillshadeLayer.show = e.target.checked;
    });
    document.getElementById('terrain-toggle').addEventListener('change', e => {
      if (e.target.checked) {
        if (Cesium.Terrain) {
          viewer.scene.setTerrain(Cesium.Terrain.fromWorldTerrain({ requestVertexNormals: true }));
        } else {
          viewer.terrainProvider = Cesium.createWorldTerrain({ requestVertexNormals: true });
        }
      } else {
        viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider();
      }
    });
    document.getElementById('view-toggle').addEventListener('change', e => {
      viewer.scene.mode = e.target.checked
        ? Cesium.SceneMode.SCENE2D
        : Cesium.SceneMode.SCENE3D;
    });
  </script>
</body>
</html>
